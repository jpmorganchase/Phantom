[project]
name = "Phantom"
description = "A Multi-agent reinforcement-learning simulator framework."
version = "2.2.0"
authors = [
    { name = "JPM AI Research" }
]
requires-python = ">3.9,<3.12"
readme = "README.md"
classifiers=[
    "Development Status :: 5 - Production",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
keywords=["ai", "research", "reinforcement learning", "simulator", "multi-agent"]
dynamic=["dependencies"]


[tool.poetry]
name = "Phantom"
version = "2.2.0"
description = "A Multi-agent reinforcement-learning simulator framework."
authors = ["JPM AI Research"]
readme = "README.md"
packages = [{include = "phantom"}]

[tool.poetry.dependencies]
python = "^3.9,<3.12"
cloudpickle = "^3.0"
ray = { version = "==2.7.1", extras = ["rllib"] }
rich = "^13.0"
tensorboardX = "^2.6"
torch = "^2.0"
termcolor = "^2.0"

[tool.poetry.group.dev.dependencies]
# https://stackoverflow.com/questions/72191560/importerror-cannot-import-name-soft-unicode-from-markupsafe
markupsafe = "==2.0.1"
mypy = "^1.9"
pre-commit = "^3.7"
pytest = "^8.1"
pytest-cov = "^5.0"
ruff = "^0.3"
sphinx = "^7.2"
sphinx-autodoc-typehints = "^2.0"
sphinx_rtd_theme = "^2.0"


[tool.mypy]
python_version = "3.9"

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gymnasium.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ray.*"
ignore_missing_imports = true


[tool.ruff]
ignore = ["E501"] # E203, W503

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
